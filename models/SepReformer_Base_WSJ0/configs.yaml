project: "[Project] SepReformer"
notes: >
  SepACap adaptation for jaCappella:
  1. Updated to 6 output stems (alto, bass, lead, soprano, tenor, perc).
  2. Integrated SNAKE periodic activations for harmonic modeling[cite: 41, 52].
  3. Switched to Composite Loss (Waveform, Mel, Spectral) for silence-awareness[cite: 42, 60].
  4. Enabled Power Set Dynamic Mixing for variable singer counts[cite: 43, 65].

# ------------------------------------------------------------------------------------------------------------------------------ #
config:
    # ------------------------------------------------------------ #
    dataset:
        [cite_start]max_len: 32000             # 4-second snippets at 8kHz [cite: 75]
        sampling_rate: 8000
        scp_dir: "/content/SepReformer-main/data/scp_ss_8k_jacappella"
        train:
            mixture: "tr_mixture.scp"
            spk1: "tr_alto.scp"
            spk2: "tr_bass.scp"
            spk3: "tr_lead_vocal.scp"
            spk4: "tr_soprano.scp"
            spk5: "tr_tenor.scp"
            spk6: "tr_vocal_percussion.scp"
            [cite_start]dynamic_mixing: true   # Enables Power Set Augmentation [cite: 43, 65]
        valid:
            mixture: "cv_mixture.scp"
            spk1: "cv_alto.scp"
            spk2: "cv_bass.scp"
            spk3: "cv_lead_vocal.scp"
            spk4: "cv_soprano.scp"
            spk5: "cv_tenor.scp"
            spk6: "cv_vocal_percussion.scp"
        test:
            mixture: "tt_mixture.scp"
            spk1: "tt_alto.scp"
            spk2: "tt_bass.scp"
            spk3: "tt_lead_vocal.scp"
            spk4: "tt_soprano.scp"
            spk5: "tt_tenor.scp"
            spk6: "tt_vocal_percussion.scp"
    # ------------------------------------------------------------ #
    dataloader:
        batch_size: 2
        pin_memory: false
        num_workers: 12
        drop_last: false
    # ------------------------------------------------------------ #
    model:
        num_stages: &var_model_num_stages 4
        [cite_start]num_spks: &var_model_num_spks 6    # Expanded to 6 stems 
        [cite_start]activation: "SNAKE"               # SnaKE activation for periodic singing [cite: 41, 52]
        module_audio_enc:
            in_channels: 1
            out_channels: &var_model_audio_enc_out_channels 256
            kernel_size: &var_model_audio_enc_kernel_size 16
            stride: &var_model_audio_enc_stride 4
            groups: 1
            bias: false
        module_feature_projector:
            num_channels: *var_model_audio_enc_out_channels 
            in_channels: *var_model_audio_enc_out_channels
            out_channels: &feature_projector_out_channels 128
            kernel_size: 1
            bias: false
        module_separator:
            num_stages: *var_model_num_stages
            relative_positional_encoding:
                in_channels: *feature_projector_out_channels
                num_heads: 8
                maxlen: 2000
                embed_v: false
            enc_stage:
                global_blocks:
                    in_channels: *feature_projector_out_channels
                    num_mha_heads: 8
                    dropout_rate: 0.05
                local_blocks:
                    in_channels: *feature_projector_out_channels
                    kernel_size: 65
                    dropout_rate: 0.05
                down_conv_layer:
                    in_channels: *feature_projector_out_channels
                    samp_kernel_size: &var_model_samp_kernel_size 5
            spk_split_stage:
                in_channels: *feature_projector_out_channels
                num_spks: *var_model_num_spks
            simple_fusion:
                out_channels: *feature_projector_out_channels
            dec_stage:
                num_spks: *var_model_num_spks
                global_blocks:
                    in_channels: *feature_projector_out_channels
                    num_mha_heads: 8
                    dropout_rate: 0.05
                local_blocks:
                    in_channels: *feature_projector_out_channels
                    kernel_size: 65
                    dropout_rate: 0.05
                spk_attention:
                    in_channels: *feature_projector_out_channels
                    num_mha_heads: 8
                    dropout_rate: 0.05
        module_output_layer:
            in_channels: *var_model_audio_enc_out_channels
            out_channels: *feature_projector_out_channels
            num_spks: *var_model_num_spks
        module_audio_dec:
            in_channels: *var_model_audio_enc_out_channels
            out_channels: 1
            kernel_size: *var_model_audio_enc_kernel_size
            stride: *var_model_audio_enc_stride
            bias: false
    # ------------------------------------------------------------ #
    criterion:
        # Replaced SI-SDR with Composite Objective for silence handling [cite: 42, 53]
        name: ["SepACapCompositeLoss"] 
        SepACapCompositeLoss:
            weights:
                [cite_start]waveform: 1.0             # L1 time-domain loss 
                [cite_start]mel: 0.7                  # Multi-scale Mel loss 
                [cite_start]spectral: 0.3             # Multi-resolution spectral loss 
            window_sizes: [512, 1024, 2048]
            num_spks: *var_model_num_spks
    # ------------------------------------------------------------ #
    optimizer:
        name: ["AdamW"]
        AdamW:
            lr: 1.0e-3
            weight_decay: 1.0e-2
    # ------------------------------------------------------------ #
    scheduler:
        name: ["ReduceLROnPlateau", "WarmupConstantSchedule"]
        ReduceLROnPlateau:
            mode: "min"
            min_lr: 1.0e-10
            factor: 0.8
            patience: 2
        WarmupConstantSchedule:
            warmup_steps: 1000
    # ------------------------------------------------------------ #
    check_computations:
        dummy_len: 16000
    # ------------------------------------------------------------ #
    engine:
        max_epoch: 200
        gpuid: "0" 
        mvn: false
        clip_norm: 5
        start_scheduling: 50
        test_epochs: [100, 120, 150, 170]